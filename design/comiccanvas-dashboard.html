<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comic Canvas — your diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --field:#F7F6F1; --card:#FFFFFF; --ink:#151515; --mute:#6B6B66; --rule:#DDDBD3; --rule-soft:#ECEAE2;
  --mustard:#E9D24A; --mustard-soft:#F3E9A8; --mustard-deep:#C9B22E; --charcoal:#1E1E1C;
  --ok:#3C8C5A; --warn:#C9722E;
  --sans:"Inter",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --r:16px; --shadow:0 1px 0 rgba(21,21,21,.05),0 10px 28px -16px rgba(21,21,21,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--field);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;letter-spacing:-.015em;line-height:1.15}
h1{font-size:30px;font-weight:800}h2{font-size:20px;font-weight:800}h3{font-size:15px;font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.mono{font-family:var(--mono);font-size:12px;color:var(--mute)}
.kick{font-family:var(--mono);font-size:12px;color:var(--mute);display:flex;align-items:center;gap:10px}
.kick::before{content:"";width:24px;height:3px;background:var(--mustard);border-radius:2px}
.hl{background:linear-gradient(transparent 58%,var(--mustard-soft) 58%)}
.dc{float:left;font-weight:800;font-size:2.7em;line-height:.85;padding:.04em .1em 0 0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
@media (max-width:900px){.shell{grid-template-columns:1fr}}
.side{padding:20px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.side{position:static;height:auto}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;padding:6px 8px}
.brand i{width:26px;height:3px;background:var(--mustard);border-radius:2px}
.navcard{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px}
.navcard a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink)}
.navcard a svg{width:18px;height:18px;flex:none}
.navcard a:hover{background:var(--field)}
.navcard a.on{background:var(--mustard-soft);border:1px solid var(--mustard-deep);padding:9px 11px}
.navcard .sep{height:1px;background:var(--rule-soft);margin:6px 8px}
.navcard .out{margin-top:auto;justify-content:center;background:var(--charcoal);color:#fff;border-radius:999px}
.navcard .out:hover{background:#000}
.streak{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.streak b{font-size:26px;font-weight:800;display:block;line-height:1}
.main{padding:20px 24px 60px;max-width:1240px;width:100%}
.top{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:18px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.search input{border:0;outline:0;flex:1;background:transparent;min-width:0}
.search .mic{width:34px;height:34px;border-radius:999px;border:1.5px solid var(--ink);background:#fff;display:grid;place-items:center;cursor:pointer}
.search .mic svg{width:16px;height:16px}
.tags{display:flex;gap:12px;flex-wrap:wrap;font-weight:600;font-size:13px;color:var(--mute);margin:8px 16px 0}
.user{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px 5px 5px;box-shadow:var(--shadow);font-weight:600;font-size:14px}
.user svg{width:32px;height:32px}
.page{display:none}.page.on{display:block}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:6px 0 18px;flex-wrap:wrap}
.head p{color:var(--mute);max-width:60ch}

/* ---------- bento ---------- */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;min-width:0}
.card.soft{background:var(--mustard-soft)}
.card.dark{background:var(--charcoal);color:#fff}
.card.dark .mono,.card.dark p{color:#D9D7CC}
.card .cap{position:absolute;right:14px;top:14px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
@media (max-width:1100px){.s3,.s4,.s5{grid-column:span 6}.s7,.s8,.s9{grid-column:span 12}}
@media (max-width:700px){.grid>*{grid-column:span 12!important}}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--mustard);border-color:var(--mustard)}
.btn.dark{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn svg{width:16px;height:16px}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-family:var(--mono);font-size:12px;background:var(--field);border:1px solid var(--rule)}
.pill.ok{background:#E6F2EA;border-color:#9CC9AC;color:#215F3A}
.pill.warn{background:#FBEBDD;border-color:#E6B58F;color:#7A3E10}
.pill.mus{background:var(--mustard-soft);border-color:var(--mustard-deep)}
textarea{width:100%;min-height:120px;border:1.5px solid var(--ink);border-radius:12px;padding:12px;resize:vertical;background:#fff}
textarea:focus,input:focus,select:focus{outline:2px solid var(--mustard);outline-offset:1px}
input[type=text],input[type=email],input[type=password],input[type=time],select{border:1.5px solid var(--ink);border-radius:10px;padding:9px 12px;background:#fff;width:100%}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.stages{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.stages li{border:1px solid var(--rule);border-radius:8px;padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--mute);background:var(--field)}
.stages li.run{border-color:var(--mustard-deep);background:var(--mustard-soft);color:var(--ink)}
.stages li.done{border-color:var(--ink);background:#fff;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.stages li.run{animation:pulse 1.1s ease-in-out infinite}}
@keyframes pulse{50%{background:#fff}}

/* strip + panels */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.strip.six{grid-template-columns:repeat(3,1fr)}
.pnl{border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.pnl svg{display:block;width:100%;height:auto}
.pnl .c{background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:5px 8px}
.pnl .c[contenteditable]:focus{outline:2px solid var(--mustard)}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ab .opt{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0}
.ab .opt .m{font-family:var(--mono);font-size:11px;color:var(--mute);padding:6px 8px;border-top:1px solid var(--rule-soft)}
.ab .opt.crit{outline:2px dashed var(--mute);outline-offset:-2px}
.ab .opt.pick{outline:3px solid var(--mustard);outline-offset:-3px}
.ab .opt.lose{opacity:.45}
.thumbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumb{border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer}
.thumb .t{padding:6px 8px;font-family:var(--mono);font-size:11px;color:var(--mute);display:flex;justify-content:space-between}
.thumb .mini{display:grid;grid-template-columns:1fr 1fr}
.thumb .mini svg{display:block;width:100%;height:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;border:1px solid var(--rule);border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--mute);position:relative;cursor:pointer}
.cal .d.has{background:#fff;border-color:var(--ink);color:var(--ink)}
.cal .d.has::after{content:"";position:absolute;bottom:5px;width:6px;height:6px;border-radius:999px;background:var(--mustard)}
.cal .d.today{outline:2px solid var(--mustard);outline-offset:-2px}
.cal .h{font-family:var(--mono);font-size:11px;color:var(--mute);text-align:center;padding-bottom:4px}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.person{display:flex;gap:12px;align-items:center}
.person svg{width:44px;height:44px;flex:none}
.person b{display:block}
.person span{font-size:13px;color:var(--mute)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.sty{border:1.5px solid var(--ink);border-radius:12px;padding:10px;background:#fff;cursor:pointer;text-align:left}
.sty.on{outline:3px solid var(--mustard);outline-offset:-3px}
.sty .sw{height:54px;border-radius:8px;margin-bottom:8px;border:1px solid var(--rule)}
.range{display:flex;align-items:center;gap:10px}
.range input{flex:1;accent-color:var(--mustard-deep)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:500;border-bottom:1.5px solid var(--ink);padding:8px 6px}
td{padding:9px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
canvas.chart{width:100%;height:auto;aspect-ratio:2.2;display:block}
.spark{width:100%;height:auto;display:block}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ---------- auth ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.authcard{width:min(440px,100%);background:var(--card);border:1.5px solid var(--ink);border-radius:20px;padding:28px;box-shadow:var(--shadow)}
.authcard h1{font-size:26px;margin:6px 0 4px}
.authcard .sub{color:var(--mute);margin-bottom:18px}
.authcard form{display:flex;flex-direction:column;gap:12px}
.authcard .alt{margin-top:14px;font-size:13px;color:var(--mute);text-align:center}
.authcard .alt button{border:0;background:none;font-weight:700;cursor:pointer;text-decoration:underline}
.err{background:#FBEBDD;border:1px solid #E6B58F;color:#7A3E10;padding:8px 12px;border-radius:10px;font-size:13px}
.note{font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:14px}

/* ---------- print (weekly PDF) ---------- */
.printonly{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  .shell,.toast{display:none!important}
  .printonly{display:block;font-size:12px;color:#111}
  .printonly h1{font-size:24px;margin-bottom:2px}
  .printonly .mono{color:#555}
  .printonly .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
  .printonly .pnl{border:1.2px solid #111;border-radius:6px}
  .printonly .pnl .c{background:#111;color:#fff;font-size:10px}
  .printonly .two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
  .printonly .box{border:1.2px solid #111;border-radius:8px;padding:10px}
  .printonly .stat{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
  .printonly .stat div{border:1px solid #111;border-radius:6px;padding:6px;text-align:center}
  .printonly .stat b{display:block;font-size:16px}
  .printonly .person{display:flex;gap:8px;align-items:center;margin:6px 0}
  .printonly .person svg{width:28px;height:28px}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="printonly" id="printarea"></div>
<script>
/* =====================================================================
   CONFIG — fill these in when wiring to your backend.
   Auth: Supabase email + password via the GoTrue REST API (no SDK needed).
   Data: FastAPI on Railway. Every call goes through API.*; with apiBase
   empty the dashboard runs on realistic mock data so you can feel it.
   ===================================================================== */
const CONFIG={
  supabaseUrl:'',            // e.g. https://xyzcompany.supabase.co
  supabaseAnonKey:'',        // public anon key
  apiBase:''                 // e.g. https://comiccanvas-api.up.railway.app
};
/* Expected FastAPI routes (all Bearer <supabase access token>):
   POST /days                {text|audio_url}          -> {job_id}
   GET  /days/{date}                                    -> strip, panels, candidates, script, beats
   GET  /jobs/{id}/events    (SSE)                      -> stage updates
   POST /feedback/pair       {panel_id, chosen, rejected}
   POST /feedback/caption    {panel_id, original, edited}
   GET  /library?month=YYYY-MM                          -> days with thumbs
   GET  /search?q=                                      -> beats + panels
   GET  /weekly/{iso_week}                              -> recap strip, mood, stats, cast
   GET/POST /cast, POST /cast/{id}/photos, POST /cast/{id}/train
   GET/PUT /settings                                    -> style, humor, reminder, generator
   GET  /learning                                       -> pick-rate series, pairs, checkpoints
   GET  /account/export, DELETE /account                                                     */

const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];
const state={user:null,token:null,route:'today',today:null,pairs:96,caps:41,picks:{},library:{},settings:{style:'ink',humor:7,reminder:'20:30',gen:'leonardo'}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200);}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- auth ---------- */
const AUTH={
  async signIn(email,password){
    if(!CONFIG.supabaseUrl){await wait(500);return {user:{email,id:'mock'},access_token:'mock'};}
    const r=await fetch(`${CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.supabaseAnonKey},body:JSON.stringify({email,password})});
    const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Sign-in failed');return d;
  },
  async signUp(email,password,name){
    if(!CONFIG.supabaseUrl){await wait(600);return {user:{email,id:'mock',user_metadata:{name}},access_token:'mock'};}
    const r=await fetch(`${CONFIG.supabaseUrl}/auth/v1/signup`,{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.supabaseAnonKey},body:JSON.stringify({email,password,data:{name}})});
    const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'Sign-up failed');return d;
  }
};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const API={
  async call(method,path,body){
    if(!CONFIG.apiBase)return null; // mock mode
    const r=await fetch(CONFIG.apiBase+path,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+state.token},body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw new Error(`${method} ${path} → ${r.status}`);return r.json();
  }
};

/* ---------- drawing: line-art people + comic panels (placeholders for real renders) ---------- */
function person(hair,shirt,mood){
  const m={smile:'<path d="M27 40 q5 5 10 0" fill="none" stroke="#151515" stroke-width="2"/>',oh:'<ellipse cx="32" cy="41" rx="3" ry="4.5" fill="#151515"/>',flat:'<path d="M28 41 h8" stroke="#151515" stroke-width="2"/>'}[mood]||'';
  const h={bun:'<circle cx="18" cy="14" r="7" fill="#151515"/><path d="M14 26 q18 -18 36 0" fill="#151515"/>',fringe:'<path d="M13 30 q19 -20 38 0 l-4 -2 q-15 -10 -30 0z" fill="#151515"/>',curly:'<path d="M12 28 q4 -18 20 -14 q16 -4 20 14 q-6 -6 -12 -2 q-8 -8 -16 0 q-6 -4 -12 2z" fill="#151515"/>'}[hair]||'';
  return `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="18" fill="#fff" stroke="#151515" stroke-width="2"/>${h}<circle cx="26" cy="33" r="1.8" fill="#151515"/><circle cx="38" cy="33" r="1.8" fill="#151515"/>${m}<path d="M14 64 q18 -20 36 0z" fill="${shirt}" stroke="#151515" stroke-width="2"/></svg>`;
}
const HT='<svg width="0" height="0" style="position:absolute"><defs><pattern id="ht" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r=".7" fill="#151515" opacity=".14"/></pattern></defs></svg>';
function panel(bg,scene,exp,v){
  v=v||0;
  const face={panic:'<circle cx="-5" cy="-1" r="3" fill="#fff" stroke="#151515" stroke-width="1.5"/><circle cx="5" cy="-1" r="3" fill="#fff" stroke="#151515" stroke-width="1.5"/><ellipse cx="0" cy="7" rx="3" ry="4.5" fill="#151515"/>',content:'<path d="M-8 -1 q3 2 6 0 M2 -1 q3 2 6 0 M-5 5 q5 6 10 0" fill="none" stroke="#151515" stroke-width="1.6"/>',tired:'<path d="M-8 -1 h6 M2 -1 h6 M-4 7 q4 -2 8 0" fill="none" stroke="#151515" stroke-width="1.6"/>',angry:'<path d="M-8 -5 l6 2 M8 -5 l-6 2 M-4 7 h8" fill="none" stroke="#151515" stroke-width="1.6"/>',happy:'<path d="M-8 -1 q3 -2 6 0 M2 -1 q3 -2 6 0" fill="none" stroke="#151515" stroke-width="1.6"/><path d="M-5 5 q5 7 10 0z" fill="#151515"/>'}[exp]||'';
  const sc={bed:'<rect x="90" y="70" width="80" height="26" rx="5" fill="#C9A27A" stroke="#151515" stroke-width="1.5"/><rect x="20" y="16" width="44" height="36" fill="#DCE6EE" stroke="#151515" stroke-width="1.5"/>',desk:'<rect x="10" y="84" width="160" height="7" fill="#A68A6A" stroke="#151515" stroke-width="1.5"/><rect x="105" y="50" width="56" height="36" rx="3" fill="#2B2B2B"/><rect x="110" y="55" width="46" height="26" fill="#1E2A38"/><rect x="114" y="60" width="30" height="3" fill="#4CAF7D"/><rect x="114" y="67" width="36" height="4" fill="#E5484D"/>',kitchen:'<rect x="10" y="88" width="160" height="7" fill="#D9C9B4" stroke="#151515" stroke-width="1.5"/><ellipse cx="48" cy="86" rx="24" ry="6" fill="#fff" stroke="#151515" stroke-width="1.5"/><ellipse cx="48" cy="82" rx="19" ry="6" fill="#E0A244" stroke="#151515" stroke-width="1.5"/>',gym:'<rect x="10" y="90" width="160" height="6" fill="#8a8a8a" stroke="#151515" stroke-width="1.5"/><rect x="118" y="44" width="42" height="46" fill="#6e6e6e" stroke="#151515" stroke-width="1.5"/><rect x="24" y="76" width="66" height="8" rx="3" fill="#3a3a3a" stroke="#151515" stroke-width="1.5"/>',park:'<rect x="10" y="88" width="160" height="8" fill="#7FB069" stroke="#151515" stroke-width="1.5"/><circle cx="150" cy="26" r="12" fill="#E9D24A" stroke="#151515" stroke-width="1.5"/><rect x="30" y="50" width="8" height="40" fill="#8B5A2B" stroke="#151515" stroke-width="1.5"/><circle cx="34" cy="44" r="18" fill="#4E9A51" stroke="#151515" stroke-width="1.5"/>',cafe:'<rect x="10" y="88" width="160" height="7" fill="#A68A6A" stroke="#151515" stroke-width="1.5"/><rect x="110" y="66" width="50" height="22" rx="4" fill="#C9A27A" stroke="#151515" stroke-width="1.5"/><rect x="122" y="52" width="14" height="14" rx="2" fill="#fff" stroke="#151515" stroke-width="1.5"/>'}[scene]||'';
  let cx=scene==='bed'?60:scene==='desk'?70:scene==='kitchen'?100:70;if(v)cx=180-cx;
  const extra=v?'<rect x="14" y="14" width="30" height="34" fill="#E9D24A" stroke="#151515" stroke-width="1.2" opacity=".9"/>':'<rect x="150" y="60" width="14" height="14" fill="#4E9A51" stroke="#151515" stroke-width="1.2"/>';

async function runToday(){

function spark(vals,W,H){const n=vals.length;const pts=vals.map((v,i)=>[6+i*(W-12)/(n-1),H-6-v*(H-14)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return `<path d="${d}" fill="none" stroke="#151515" stroke-width="2.5" stroke-linecap="round"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#E9D24A" stroke="#151515" stroke-width="1.5"/>`).join('')}`;}

  const S=[['ink','Flat ink','linear-gradient(135deg,#F6EBD5,#E4E9EE)'],['paper','Newspaper','repeating-linear-gradient(0deg,#f3f0e6 0 3px,#e6e2d4 3px 4px)'],['water','Watercolor','radial-gradient(circle at 30% 30%,#F3E9A8,#E1EFD9 60%,#F6E1D0)'],['night','Night mode','linear-gradient(135deg,#1E1E1C,#3a3a36)']];
  const s=state.settings;
  $('#p-style').innerHTML=`<div class="head"><div><div class="kick">Style & voice</div><h1>How your diary looks and sounds</h1></div><p>Changes apply from tonight\u2019s strip. Your identity and taste model carry over between styles.</p></div>
  <div class="grid">
    <div class="card s7 stack"><h2>Style pack</h2><div class="styles">${S.map(([k,n,g])=>`<button class="sty ${s.style===k?'on':''}" data-k="${k}"><div class="sw" style="background:${g}"></div><b>${n}</b></button>`).join('')}</div></div>
    <div class="card s5 stack"><h2>Voice</h2><label class="f">Humor <div class="range"><span class="mono">gentle</span><input type="range" min="0" max="10" value="${s.humor}" id="humor"><span class="mono">roast</span></div></label><label class="f">Caption length<select><option>Short (≤ 60 chars)</option><option>Medium</option></select></label><label class="f">Sensitive days<select><option>Turn humor off automatically</option><option>Ask me first</option></select></label></div>
    <div class="card s4 stack"><h2>Reminder</h2><label class="f">Evening nudge<input type="time" value="${s.reminder}" id="rem"></label><label class="f">Channel<select><option>Push notification</option><option>Telegram</option><option>Email</option></select></label></div>
    <div class="card s4 stack"><h2>Illustrator</h2><label class="f">Generator<select id="gen"><option value="leonardo" ${s.gen==='leonardo'?'selected':''}>Leonardo Phoenix (character reference)</option><option value="flux" ${s.gen==='flux'?'selected':''}>Flux Dev + my LoRA (learns from my taps)</option></select></label><p class="mono">Flux is the one Diffusion-DPO can improve.</p></div>
    <div class="card s4 stack soft"><h2>Background detail</h2><label class="f">Environments<select><option>Rich (props, texture, lighting)</option><option>Minimal</option></select></label><p class="mono">Characters stay simple; rooms get the detail.</p></div>
  </div>`;
  $$('#p-style .sty').forEach(b=>b.addEventListener('click',()=>{state.settings.style=b.dataset.k;$$('#p-style .sty').forEach(x=>x.classList.toggle('on',x===b));save();}));
  $('#humor').addEventListener('change',e=>{state.settings.humor=+e.target.value;save();});
  $('#rem').addEventListener('change',e=>{state.settings.reminder=e.target.value;save();});
  $('#gen').addEventListener('change',e=>{state.settings.gen=e.target.value;save();});
  function save(){API.call('PUT','/settings',state.settings).catch(()=>{});toast('Saved');}
}

/* ---------- LEARNING ---------- */
function renderLearning(){
  $('#p-learning').innerHTML=`<div class="head"><div><div class="kick">Learning</div><h1>What your taps have taught it</h1></div><p>Every pair you tap trains a small reward model; once a week the writer and illustrator move toward what you kept. Nothing ships unless it beats last week on held-out picks.</p></div>
  <div class="grid">
    <div class="card s8 stack"><div class="row" style="justify-content:space-between"><h2>First-pick rate by week</h2><span class="mono">held-out, % of pairs where its first choice was yours</span></div><canvas class="chart" id="curve" width="880" height="400"></canvas></div>
    <div class="card s4 stack soft"><div class="kick">Signals</div><div class="row" style="gap:18px"><div><div class="big">${state.pairs}</div><span class="mono">image pairs</span></div><div><div class="big">${state.caps}</div><span class="mono">caption edits</span></div></div><p>Next training run: Sunday 02:00. Runs need at least 8 new pairs.</p></div>
    <div class="card s12"><h2 style="margin-bottom:10px">Checkpoints</h2><table><thead><tr><th>Date</th><th>Job</th><th>Data</th><th>Result</th><th>Status</th></tr></thead><tbody>
      <tr><td>Aug 31</td><td>Reward model v7</td><td>85 pairs</td><td>pick acc 0.76 → 0.79</td><td><span class="pill ok">promoted</span></td></tr>
      <tr><td>Aug 31</td><td>Script DPO v3</td><td>34 caption pairs</td><td>win-rate 61% vs v2</td><td><span class="pill ok">promoted</span></td></tr>
      <tr><td>Aug 24</td><td>Prompt GRPO v2</td><td>critic reward</td><td>identity +0.04, alignment −0.01</td><td><span class="pill warn">rejected (alignment)</span></td></tr>
      <tr><td>Aug 17</td><td>Diffusion-DPO v1</td><td>312 pairs</td><td>pick acc +5 pts</td><td><span class="pill ok">promoted</span></td></tr>
    </tbody></table></div>
  </div>`;
  const c=$('#curve'),ctx=c.getContext('2d'),W=c.width,H=c.height,L=60,R=20,T=20,B=44;
  ctx.font='14px Inter,sans-serif';ctx.fillStyle='#6B6B66';ctx.strokeStyle='#ECEAE2';
  for(let v=40;v<=90;v+=10){const y=T+(H-T-B)*(1-(v-35)/55);ctx.beginPath();ctx.moveTo(L,y);ctx.lineTo(W-R,y);ctx.stroke();ctx.fillText(v+'%',12,y+5);}
  PICKS.forEach((v,i)=>{const x=L+(W-L-R)*i/(PICKS.length-1);ctx.fillText('wk '+(27+i),x-16,H-14);});
  ctx.strokeStyle='#151515';ctx.lineWidth=3;ctx.beginPath();PICKS.forEach((v,i)=>{const x=L+(W-L-R)*i/(PICKS.length-1),y=T+(H-T-B)*(1-(v-35)/55);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});ctx.stroke();
  PICKS.forEach((v,i)=>{const x=L+(W-L-R)*i/(PICKS.length-1),y=T+(H-T-B)*(1-(v-35)/55);ctx.fillStyle='#E9D24A';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.stroke();});
  [3,6,9].forEach(i=>{const x=L+(W-L-R)*i/(PICKS.length-1);ctx.setLineDash([4,4]);ctx.strokeStyle='#C9B22E';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,T);ctx.lineTo(x,H-B);ctx.stroke();ctx.setLineDash([]);});
  ctx.fillStyle='#6B6B66';ctx.fillText('dashed = checkpoint promoted',L+8,T+14);
}

  panels:[{scene:'bed',bg:'#F6EBD5',exp:'panic',cap:'7:52 AM. The alarm had one job.'},{scene:'desk',bg:'#E4E9EE',exp:'angry',cap:'Three hours. One trailing space.'},{scene:'kitchen',bg:'#F6E1D0',exp:'content',cap:'Leftover biryani: undefeated.'},{scene:'gym',bg:'#E5E5E5',exp:'tired',cap:'Legs have filed a complaint.'}],
  beats:[['morning','bedroom','alarm failed, overslept, ran for the bus','panic',0.8],['morning','desk','debugged n8n workflow; trailing space in a field name','disbelief',0.9],['midday','kitchen','leftover biryani, mood recovered','content',0.5],['evening','gym','first session in two weeks; legs sore','tired',0.7]]}};

  <div class="grid">
    <div class="card s7 stack"><h2>The strip</h2>${stripHTML(day,false)}<p class="mono">Leonardo Phoenix · 12 candidates · 3 retries · $0.31 · 48 s</p></div>
    <div class="card s5 stack"><h2>What you said</h2><p style="color:#2E3140">${esc(day.text)}</p><span class="mono">Whisper large-v3-turbo · 92 s · WER hint list: 40 terms</span></div>
    <div class="card s12 stack"><h2>Beats the extractor found</h2><table><thead><tr><th>When</th><th>Where</th><th>What happened</th><th>Emotion</th><th>Importance</th></tr></thead><tbody>${day.beats.map(b=>`<tr><td class="mono">${b[0]}</td><td>${b[1]}</td><td>${esc(b[2])}</td><td>${b[3]}</td><td class="mono">${b[4]}</td></tr>`).join('')}</tbody></table></div>
    <div class="card s12 stack"><div class="row" style="justify-content:space-between"><h2>Candidates the critic saw</h2><span class="mono">chosen = solid outline · your tap = mustard</span></div>
      ${day.panels.slice(0,2).map((p,i)=>`<div><div class="kick" style="margin:6px 0">Panel ${i+1}</div><div class="ab" style="grid-template-columns:repeat(3,1fr)"><div class="opt pick">${panel(p.bg,p.scene,p.exp,0)}<div class="m">identity 0.63 · style 0.86 · align 0.32 · chosen</div></div><div class="opt">${panel(p.bg,p.scene,p.exp,1)}<div class="m">identity 0.58 · style 0.81 · align 0.29</div></div><div class="opt lose">${panel(p.bg,p.scene,p.exp,0)}<div class="m">identity 0.41 · rejected: identity</div></div></div></div>`).join('')}
    </div>
    <div class="card s12 stack"><h2>Prompts</h2><table><thead><tr><th>#</th><th>Positive</th><th>Negative</th></tr></thead><tbody>${day.panels.map((p,i)=>`<tr><td class="mono">${i+1}</td><td>flat ink comic panel, [IDENTITY] ${esc(p.cap.toLowerCase())}, ${p.scene} interior with props, warm light, halftone paper texture</td><td class="mono">text, watermark, extra fingers</td></tr>`).join('')}</tbody></table></div>
  </div>`;
  $('#dshare').addEventListener('click',()=>toast('Exports 1080×1080 and 1080×1920 PNGs'));

/* ---------- PERSON DETAIL ---------- */

  $('#p-detail').innerHTML=`<div class="head"><div><div class="kick"><a href="#cast">Cast</a> · ${esc(c.n)}</div><h1>${esc(c.n)}</h1></div><div class="row"><span class="pill ${c.st}">${c.st==='ok'?'ready':'training'}</span>${c.n!=='You'?'<button class="btn sm">Remove from cast</button>':''}</div></div>
  <div class="grid">
    <div class="card s7 stack"><div class="row" style="justify-content:space-between"><h2>Reference photos</h2><span class="mono">${c.s.split('·')[0]}</span></div>
      <div class="thumbgrid" style="grid-template-columns:repeat(auto-fill,minmax(110px,1fr))">${Array.from({length:8},(_,i)=>`<div class="thumb" style="aspect-ratio:1;display:grid;place-items:center;background:${i%3?'#F6EBD5':'#E4E9EE'}">${person(c.hair,c.shirt,['smile','oh','flat'][i%3])}</div>`).join('')}<div class="thumb" style="aspect-ratio:1;display:grid;place-items:center;border-style:dashed;color:var(--mute);font-weight:700">+ add</div></div>

    <div class="card s5 stack"><h2>Look card</h2><p style="color:#2E3140">${c.n==='You'?'Dark wavy hair, thin rectangular glasses, warm brown skin, usually a blue hoodie. Expressive eyebrows. Slight stubble.':'Hair tied back, no glasses, mustard jacket, big grin.'}</p><span class="mono">Written by the VLM from the photos; edit anything that\u2019s off.</span><div class="row"><button class="btn sm">Edit</button><button class="btn sm pri">Retrain identity</button></div></div>
    <div class="card s4 stack"><div class="kick">Identity model</div><p><b>${c.n==='You'?'Flux LoRA v3':'Character Reference'}</b><br><span class="mono">ArcFace match on last 20 panels: 0.61 avg</span></p></div>
    <div class="card s4 stack"><div class="kick">Appearances</div><div class="big">${c.n==='You'?'42':'6'}</div><p>panels this month · ${esc(c.a)}</p></div>

/* ---------- ONBOARDING ---------- */
function renderOnboarding(step){
  step=+step||1;const total=4;
  const steps=['Your photos','Your look','Your style','Your evening'];
  const dots=steps.map((t,i)=>`<span class="pill ${i+1===step?'mus':(i+1<step?'ok':'')}">${i+1}. ${t}</span>`).join('');
  let body='';
  if(step===1)body=`<div class="card s7 stack"><h2>Add 15–25 photos of yourself</h2><p style="color:var(--mute)">Different angles, lighting, and expressions. No sunglasses. Two or three in your usual outfit help the character wear your clothes.</p>
      <div class="thumbgrid" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr))">${Array.from({length:6},(_,i)=>`<div class="thumb" style="aspect-ratio:1;display:grid;place-items:center;background:${i%2?'#F6EBD5':'#E4E9EE'}">${person('curly','#5B7FB5',['smile','oh','flat'][i%3])}</div>`).join('')}<label class="thumb" style="aspect-ratio:1;display:grid;place-items:center;border-style:dashed;color:var(--mute);font-weight:700;cursor:pointer">+ upload<input type="file" multiple accept="image/*" style="display:none" id="ph"></label></div>
      <div class="row"><span class="pill ok">6 usable</span><span class="pill warn">1 dropped: blur</span><span class="mono" id="phc">need 9 more</span></div></div>
    <div class="card s5 stack soft"><div class="kick">What happens next</div><p>Faces are detected and cropped, an identity embedding is stored for the critic, and a small model of you is trained (about 20 minutes). You can delete all of it any time.</p></div>`;
  if(step===2)body=`<div class="card s7 stack"><h2>Your look card</h2><p style="color:var(--mute)">Written from your photos. Fix anything that\u2019s wrong; this is what the writer uses to describe you.</p><textarea style="min-height:140px">Dark wavy hair, thin rectangular glasses, warm brown skin, usually a blue hoodie. Expressive eyebrows. Slight stubble.</textarea><label class="f">What should we call you in captions?<input type="text" value="${esc(state.user.name.split(' ')[0])}"></label></div>
    <div class="card s5 stack"><div class="kick">Preview</div><div class="pnl">${panel('#F6EBD5','cafe','content')}<div class="c">First test render. Looks like you?</div></div><div class="row"><button class="btn sm">Yes</button><button class="btn sm">Not quite</button></div></div>`;
  if(step===3)body=`<div class="card s12 stack"><h2>Pick a style</h2><p style="color:var(--mute)">Characters stay simple so they stay consistent; backgrounds get the detail. You can switch later without losing anything.</p><div class="styles">${[['ink','Flat ink','linear-gradient(135deg,#F6EBD5,#E4E9EE)'],['paper','Newspaper','repeating-linear-gradient(0deg,#f3f0e6 0 3px,#e6e2d4 3px 4px)'],['water','Watercolor','radial-gradient(circle at 30% 30%,#F3E9A8,#E1EFD9 60%,#F6E1D0)'],['night','Night mode','linear-gradient(135deg,#1E1E1C,#3a3a36)']].map(([k,n,g])=>`<button class="sty ${state.settings.style===k?'on':''}" data-k="${k}"><div class="sw" style="background:${g}"></div><b>${n}</b></button>`).join('')}</div><label class="f" style="max-width:420px">Humor<div class="range"><span class="mono">gentle</span><input type="range" min="0" max="10" value="${state.settings.humor}"><span class="mono">roast</span></div></label></div>`;
  if(step===4)body=`<div class="card s6 stack"><h2>When should it ask about your day?</h2><label class="f">Evening nudge<input type="time" value="${state.settings.reminder}"></label><label class="f">Channel<select><option>Push notification</option><option>Telegram</option><option>Email</option></select></label></div>
    <div class="card s6 stack soft"><div class="kick">You\u2019re set</div><h2>Draw your first strip tonight</h2><p>Or do it now with a few lines about today.</p><a class="btn pri" href="#today">Go to Today</a></div>`;
  $('#p-detail').innerHTML=`<div class="head"><div><div class="kick">Set up · step ${step} of ${total}</div><h1>${steps[step-1]}</h1></div><div class="row">${dots}</div></div><div class="grid">${body}</div>
  <div class="row" style="margin-top:18px;justify-content:space-between">${step>1?`<a class="btn" href="#onboarding/${step-1}">Back</a>`:'<span></span>'}${step<total?`<a class="btn pri" href="#onboarding/${step+1}">Continue</a>`:''}</div>`;
  $$('#p-detail .sty').forEach(b=>b.addEventListener('click',()=>{state.settings.style=b.dataset.k;$$('#p-detail .sty').forEach(x=>x.classList.toggle('on',x===b));}));
  const ph=$('#ph');if(ph)ph.addEventListener('change',e=>{$('#phc').textContent=`${e.target.files.length} added · uploading…`;toast('Photos go to R2 via presigned URLs');});
}

/* ---------- boot ---------- */
(function boot(){const h=location.hash.replace('#','');if(state.user)renderShell();else renderAuth(h==='signup'?'signup':'signin');})();
</script>
