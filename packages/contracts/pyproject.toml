[project]
name = "comiccanvas-contracts"
version = "0.1.0"
description = "Pydantic contracts shared by the API and worker (packages/contracts, CLAUDE.md §3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]
